<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iniciar sesion del inventario ADSO</title>
    <!--css de bootstrap 5.2.2 desde url predeterminada-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--libreria de iconos en bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet"><!--llama a los estilos peronalizados-->
</head>
<body class="bg-body-tertiary">
    <!--menu lateral-->
    <!--offcanvas en pantallas menores al lg es un panel oculto que se desliza-->
    <!--desde el lg se muestra norma. offcanvas-start lo hace salir por la izquierda. sidebar es muestra la clase el id usa el boton que lo abre-->
    <aside class="offcanvas-start sidebar" tabindex="-1" id="menuLateral" arial-labelledby="tituloMenu">
        <!--encabezado de el panel; bootstrap solo lo muestra en celular-->
        <div class="offcanvas-header border-bottom border-secondary">
            <!--nombre del sistema en el panel movil-->
            <h5 class="offcanvas-title" id="tituloMenu"><i class="bi bi-shop me-2"></i>tienda sena</h5>
            <!--button x blanco de cierre de panel -->
            <button type="button" class="btn-close btn-close-withe" data-bs-dismiss="offcanvas" data-bs-target="#menulateral" arial-labeL="cerrar menu"></button>
        </div>
        <!--cuerpo del menu flexbox em columan para apilar el logo enlaces y boton de salida -->
        <div class="offcanvas-body d-flex-column p-3">
            <!--logo solo se ve en computador -->
            <a href="dashboard.html" class="d-none d-lg-flex align-items-center mb-3 text-white text-decoration-none fs-5 fw-bold">
                <!--icono verde y nombre-->
                <i class="bi bi-shop me-2 text-sena"></i>tienda sena
                <!--cierra logo -->
            </a>
        <!--lista de navegacion en columna (flex-column) .nav-pills de forma de pildora al enlace activo mb-auto empuja lo que sigue hast ale fondo-->
        <ul class="nav nav-pills flex-column mb-auto">
            <!--Enlace al dashboard active lo resalta en verde y aria -current="page" la pafgina actual en cada modulo el active pasa si propio enlace-->
            <li class="nav-item"><a href="dashboard.html" class="nav-link active" aria-current="page"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></i>
            </li>
            <!--Enlace a modulo usuario-->
            <li class="nav-item"><a href="usuario.html" class="nav-link"><i class="bi bi-people me-2"></i>usuarios</a></i>
                <!--link categoria-->
                <li class="nav-item"><a href="categorias.html" class="nav-link"><i class="bi bi-tags me-2"></i>categorias</a></li>
                <li class="nav-item"><a href="subcategorias.html" class="nav-link"><i class="bi bi-diagram 3 me-2"></i>subcategoria</a></li>
                <li class="nav-item"><a href="productos.html" class="nav-link"><i class="bi bi-box-seam me-2"></i>categorias</a></li>
            <ul>
                <hr>
                <!--boton que se vuelve al login asi se cierra la sesion-->
                <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-left me-1"></i>cerra sesion</a>
                <!--cierra el cuerpo del menu-->
            
    
    </aside>
    <body>

        </div>
        <!--cierra el menu lateral-->
    </aside>
    <!--zona derecha del dashboard-->
    <div class="contenido">

        <!--Barra superior-->
        <!--Baara blanca con borde inferior, la deja pegada arriba al hacer scrool-->
        <nav class="navbar bg white border-bottom px3 sticky-top">
            <!--boton para abrir el menu en celular lo oculta el computador el menu siempre se ve-->
            <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral" aria-controls="menuLateral" aria-label="Abrir menu">
                <!--icono de menu hamburguesa-->
                <i class="bi bi-list"></i>
            </button>
            <!--texto de la barra se oculta en celulares muy pequeños-->
            <span class="navbar-text fw-semibold d-none d-sm-inline">Panel de administracion</span>
            <!--menu desplegable del ususario lo empuja a la derecha-->

            <div class="dropdown ms-auto">
                <!--boton que abre el desplegable-->
                <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <!--icono de usuario-->
                    <i class="bi bi-person-circle fs-5"></i>
                    <!--nombre de usuario visible en tablet-->
                    <span class="d-none d-md-inline">Admin Sena</span>
                </button>
            </div>
        </nav>
    </div>
</body>
