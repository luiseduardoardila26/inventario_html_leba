<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iniciar sesion del inventario ADSO</title>
        <link href="css/estilo.css" rel="stylesheet"><!--llama a los estilos peronalizados-->
</head>
<body class="login-fondo">

    <main class="login-card"><!--contenido principal de la pagina-->
        <header class="login-encabezado"><!--encabezado de login-->
            <!--icono de la tienda-->
            <i class="bi bi -shop display-4 text-sena"></i>
            <h1 class="h3 fw-bold">inventario SENA</h1>
            <p class="text-secondary mb-0">ingresa sus credenciales para continuar</p>
        </header>
        <form action="dashboar.html" method="get">
        <!--form crea un formulario que se envia y nos lleva a dashboard, method nos envia la informacion con get-->
        
        <div class="form-floating mb-3"><!--agrupa contenido en un contenedor-->
            <input type="email" class="form-control" id="correo" placeholder="sena@correo.com" required><!--type obliga que tenga el arroba ,el placeholder es el texto de ejemplo y el required hace que sea un campo obligatorio-->
            <label for="correo" class="bi bi-envelope me-1">correo electronico</label><!--es una etiqueta de texto que con el for conecta con corro del input-->
        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="clave" placeholder="minimo 6 caracteres "minlength="6" required><!--type=password oculta el texto que escribes, el minlength hace que deban ser minimo 6 caracteres-->
            <label for="clave"><i class ="bi bi-lock me-1"></i>contraseña</label>
        </div>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
            <input class="form-check-input" type="checkbox" id="recordar"><!--type checkbox es casilla de verificacion-->
            <label class="form-check-label" for="recordar">recordarme</label>
        </div>
        <a href="#" class="small text-decoration-none">olvido tu contraseña</a>
        </div>
        
        
        
        <button type="submit" class="btn btn-sena w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i>ingresar</button><!--envia el formulario antes revisa los campos que requiere email y minglet-->
        </form><!--cierra el formulario-->
        
        <p class="login-pie">¿no tienes cuenta?<a href="registro.html" class="text-decoration-none">registrate</a></p>
        
        <footer class="login-pie">2026 SENA - ADSO MIXTO</footer><!--pie de pagina-->

        </main>
</body>
</html>
